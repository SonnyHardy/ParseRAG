# Règles d'alerte ParseRAG (issue #38, §6) — format de règles Prometheus.
#
# Import : Alerting → Alert rules → « Import alert rules » → Prometheus YAML file. Grafana convertit
# en règles gérées par Grafana, éditables ensuite dans l'UI, et demande la source de données au
# moment de l'import : il n'y a aucun UID à substituer ici.
#
# C'est bien ce format-ci qu'attend l'import, et non le format de provisioning Grafana
# (apiVersion / orgId / folder / uid / title / condition / data), réservé au provisioning par
# fichier d'une instance auto-hébergée — l'import de Grafana Cloud le rejette avec
# « missing or invalid groups array at index 0 ».
#
# Conséquence du format : le seuil fait partie de l'expression (une règle Prometheus se déclenche
# dès que son expression renvoie au moins une série). Les états « no data » et « erreur
# d'exécution » ne s'expriment pas ici ; Grafana applique ses valeurs par défaut à l'import et ils
# se règlent ensuite par règle dans l'UI.
#
# Les trois règles sont volontairement peu nombreuses : une alerte qui ne réveille personne est du
# bruit, et sur un service à faible trafic la plupart des seuils classiques se déclenchent à vide.

groups:
  - name: parserag
    interval: 1m
    rules:

      # ── 1. Taux d'erreur sur /parse ───────────────────────────────────────────────────
      # Le garde-fou principal : il couvre indifféremment une régression de code, un modèle
      # vision indisponible ou une base qui tangue.
      # clamp_min protège le dénominateur : sans trafic, 0/0 donnerait NaN, et la règle
      # basculerait en « no data » au lieu de rester silencieuse.
      - alert: ParseRAGParseErrorRate
        expr: >-
          sum(rate(parserag_parse_total{outcome="failure"}[5m]))
          / clamp_min(sum(rate(parserag_parse_total[5m])), 0.0001)
          > 0.1
        for: 10m
        labels:
          severity: critical
          service: parserag
        annotations:
          summary: "Plus de 10 % des parses échouent depuis 10 minutes"
          description: >-
            Ventiler par error_code sur le dashboard « ParseRAG — Pipeline ».
            INTERNAL_ERROR pointe une panne non métier ; un code métier majoritaire
            (FILE_TOO_LARGE, INVALID_FILE_FORMAT) pointe plutôt un client fautif.

      # ── 2. Saturation du pool Hikari ──────────────────────────────────────────────────
      # Le pool est dimensionné à 5 (spring.datasource.hikari.maximum-pool-size). Des connexions
      # en attente signifient que des requêtes patientent avant même de toucher la base.
      - alert: ParseRAGHikariPoolSaturated
        expr: max(hikaricp_connections_pending) > 0
        for: 5m
        labels:
          severity: warning
          service: parserag
        annotations:
          summary: "Des requêtes attendent une connexion à la base depuis 5 minutes"
          description: >-
            hikaricp_connections_pending > 0 en continu. Soit le trafic dépasse le
            dimensionnement du pool (5), soit des requêtes sont anormalement lentes.

      # ── 3. Base injoignable ───────────────────────────────────────────────────────────
      # Pas de métrique « DB UP/DOWN » dédiée : ApiKeyFilter compte déjà chaque lookup de clé
      # qui échoue faute de base (reason=db_unavailable) et rend un 503. C'est un signal plus
      # direct qu'une sonde périodique — il ne se déclenche que si du trafic réel est impacté.
      - alert: ParseRAGDatabaseUnavailable
        expr: sum(rate(parserag_auth_failures_total{reason="db_unavailable"}[5m])) > 0
        for: 2m
        labels:
          severity: critical
          service: parserag
        annotations:
          summary: "Les requêtes reçoivent 503 DATABASE_UNAVAILABLE"
          description: >-
            parserag_auth_failures_total{reason="db_unavailable"} progresse : Postgres est
            injoignable ou le pool ne parvient plus à ouvrir de transaction. Tout l'API est
            hors service, aucun chemin n'est exempté du filtre de clé.
