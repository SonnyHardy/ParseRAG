spring:
  # Delai laisse aux requetes en vol lors d'un arret gracieux (issue #56) : au-dela, elles sont
  # coupees. Doit couvrir un parse en cours, sinon l'arret gracieux ne l'est que de nom.
  lifecycle:
    timeout-per-shutdown-phase: 30s
  config:
    import: optional:file:.env[.properties]
  application:
    name: ParseRAG
  autoconfigure:
    exclude:
      - org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration

  servlet:
    multipart:
      enabled: true
      max-file-size: 50MB
      max-request-size: 50MB

  datasource:
    url: jdbc:postgresql://localhost:${POSTGRES_PORT}/${POSTGRES_DB}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-timeout: 10000
      maximum-pool-size: 5
      idle-timeout: 300000
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        format-sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  # flyway config
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  port: ${SERVER_PORT:8080}
  # Arret gracieux (issue #56) : sans lui, un deploiement en cours de parse tue les requetes en
  # vol, et le client recoit une connexion coupee sans corps d'erreur exploitable.
  shutdown: graceful
  tomcat:
    threads:
      # Aligne sur la borne de concurrence du parsing (parserag.parse.max-concurrent) plus une
      # marge pour les requetes bon marche (health, erreurs). Les 200 threads par defaut n'ont
      # aucun rapport avec ce qu'un parse coute : ils ne font qu'autoriser 200 saturations
      # simultanees de la memoire avant que quoi que ce soit ne freine.
      max: 32
      min-spare: 4
    # Une requete non lue dans ce delai est abandonnee : protege des connexions ouvertes qui
    # n'envoient jamais leur corps (upload interrompu, client lent).
    # ATTENTION : ce n'est PAS un timeout de traitement - le temps de parse est borne par les
    # plafonds de pages, dont la reconciliation avec le couperet de 180 s du proxy fait l'objet
    # d'une issue dediee.
    connection-timeout: 20s


logging:
  level:
    root: INFO
    com.sonny.parserag: DEBUG

# ── Specification OpenAPI (issue #16) ─────────────────────────────────────────
# OFF par defaut, des deux cotes. La spec publiee est le snapshot docs/openapi.json ; on ne
# la regenere qu'en lancant l'application avec le profil `docs` (application-docs.yaml), ce qui
# evite d'exposer /v3/api-docs et Swagger UI en production. ApiKeyFilter filtrant *toutes* les
# requetes (issue #37), ces chemins repondraient de toute facon 401 sans cle.
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

# ── Observabilité OpenTelemetry → Grafana Cloud (issue #38) ────────────────────
# Export OFF par défaut : sans OTEL_ENABLED, aucune tentative réseau (dev, tests, CI). Les compteurs
# sont malgré tout enregistrés dans le MeterRegistry, donc lisibles via /actuator/metrics et
# assertables en test — le code instrumenté n'a aucun garde à porter.
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: never   # /api/v1/health (issue #37) reste l'endpoint métier, réservé à l'admin

  # ATTENTION : chaque signal a son chemin OTLP propre (/v1/metrics, /v1/traces, /v1/logs) — les
  # confondre est la première cause de « rien n'arrive dans Grafana ».
  # OTEL_EXPORTER_OTLP_AUTH porte la valeur complète de l'en-tête (Grafana Cloud : « Basic <base64
  # de instanceID:token> »). Spring attend ici une *map* d'en-têtes, pas la chaîne « k=v,k=v » de la
  # convention OTEL_EXPORTER_OTLP_HEADERS — d'où une entrée Authorization explicite.
  otlp:
    metrics:
      export:
        enabled: ${OTEL_ENABLED:false}
        url: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318}/v1/metrics
        headers:
          Authorization: ${OTEL_EXPORTER_OTLP_AUTH:}
        step: 60s           # intervalle d'export (issue : 30-60 s)
        # Le défaut Micrometer est « milliseconds », ce qui donnerait des séries
        # parserag_stage_duration_milliseconds_* dans Mimir. Prometheus et les panneaux Grafana
        # supposent des secondes pour les durées : on s'aligne sur la convention.
        base-time-unit: seconds
        # Cumulative, pas delta : Mimir est bâti sur Prometheus, dont le modèle est cumulatif.
        aggregation-temporality: cumulative

  tracing:
    export:
      otlp:
        enabled: ${OTEL_ENABLED:false}
    sampling:
      # Parent-based ratio (défaut Spring = parentbased_traceidratio). À 0.1, une poignée de
      # requêtes de test a toutes les chances de ne produire aucune trace exportée — mettre
      # OTEL_SAMPLING=1.0 pour valider la chaîne, puis revenir à 0.1 en régime normal.
      # Attention : les traceId apparaissent dans les logs même quand la trace n'est PAS
      # échantillonnée — leur présence ne prouve donc rien sur l'export.
      probability: ${OTEL_SAMPLING:0.1}

  logging:
    export:
      otlp:
        enabled: ${OTEL_ENABLED:false}

  opentelemetry:
    resource-attributes:
      service.name: ParseRAG
      service.version: '@project.version@'   # filtrage Maven, comme parserag.info.version
      deployment.environment: ${DEPLOY_ENV:dev}
    tracing:
      export:
        otlp:
          endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318}/v1/traces
          headers:
            Authorization: ${OTEL_EXPORTER_OTLP_AUTH:}
    logging:
      export:
        otlp:
          endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318}/v1/logs
          headers:
            Authorization: ${OTEL_EXPORTER_OTLP_AUTH:}

  observations:
    enable:
      # Spring Security instrumente chaque maillon de sa chaîne : sur une requête, cela produit
      # « authorize request », « security filterchain before » et un span par filtre (14 ici) —
      # une quinzaine de spans de plomberie qui noient les 4 étages du pipeline dans Tempo et
      # consomment le quota d'ingestion du free tier. Aucun de ces spans ne nous apprend quoi que
      # ce soit : la chaîne est statique et ses rejets sont déjà comptés par parserag.auth.failures.
      spring.security: false

  metrics:
    distribution:
      # Percentiles sur 3 timers seulement : chaque histogramme multiplie les séries, et le budget
      # du free tier Grafana Cloud (~10 k séries actives) se consomme vite.
      percentiles-histogram:
        http.server.requests: true
        parserag.parse.duration: true
        parserag.stage.duration: true

# ── ParseRAG properties (AppProperties.java) ───────────────────
parserag:
  # Identité exposée par GET /api/v1/health. @project.version@ est substituée au build par le
  # filtrage de ressources Maven (configuré par spring-boot-starter-parent).
  info:
    name: ${spring.application.name}
    version: '@project.version@'

  # Identite de l'administrateur (issue #56). ADMIN_KEY_HASH porte le SHA-256 de la cle, jamais
  # la cle : le depot ne doit contenir aucun secret, ni rien qui permette de le deviner. Vide par
  # defaut => aucune cle admin n'est creee et GET /api/v1/health reste inaccessible.
  #   Generer :  printf '%s' "<votre-cle>" | sha256sum
  security:
    admin-key-hash: ${ADMIN_KEY_HASH:}
    admin-key-email: ${ADMIN_KEY_EMAIL:admin@parserag.local}

  # Bornes d'execution du parsing (issue #56). La ressource rare est la memoire, pas le debit :
  # un upload de 50 Mo est charge entier, le PDF est rouvert six fois par requete et le rendu
  # d'une page coute ~9 Mo. Ces valeurs sont provisoires - a caler sur la memoire reelle du
  # conteneur cible une fois le deploiement en place.
  parse:
    max-concurrent: 4
    max-wait-seconds: 5

  health:
    db-ping-timeout-seconds: 3   # borne chaque sonde base (ping + lecture flyway_schema_history) : sans elle, une base down ferait attendre le connection-timeout Hikari (10 s)
    disk-path: '.'               # volume surveillé ; à pointer sur java.io.tmpdir si les uploads atterrissent sur un autre disque
    min-free-disk-mb: 500        # sous ce plancher → disk DOWN (un upload = jusqu'à 50 Mo + temporaires PDFBox)

  gemini:
    api-key: ${GOOGLE_API_KEY:}    # vide par défaut en dev (GEMINI_API_KEY est le nom legacy du SDK, non utilisé)
    model: gemini-3.5-flash-lite   # tag stable — ni -preview-*, ni alias mouvant (-latest) ; ne pas retenter 2.5-flash-lite : generateContent rend 404 « no longer available to new users » (mesuré le 20/08/2026, issue #48)
    thinking-level: minimal        # minimal|low|medium|high — transcription structurée, pas de calcul (remplace le thinking-budget de l'ère 2.5)
    max-retries: 4                 # tentatives sur 429 (rate-limit) / 5xx, backoff exponentiel (SDK)
    timeout-ms: 60000              # budget par appel (millisecondes : unité de HttpOptions)

  openai:                          # provider historique, conservé pour comparaison (issue #28)
    api-key: ${OPENAI_API_KEY:}   # vide par défaut en dev
    model: gpt-4o-mini
    max-retries: 4                 # tentatives sur 429 (rate-limit) / 5xx, backoff exponentiel (SDK)

  extraction:
    strip-line-numbers: true   # retire les n° de ligne de marge (copies de relecture)

  tables:
    enabled: true
    borderless-fallback: false # OFF : la détection sans bordures transforme prose/figures en faux tableaux (précision d'abord). Voir TODO tableaux sans bordures.
    min-rows: 2                # filtrage anti-faux-positifs (Tabula sur-détecte)
    min-cols: 2
    min-fill-ratio: 0.4        # ≥ 40% de cellules non-vides (régions déjà filtrées en amont par le détecteur ; tolère les tableaux à cellules fusionnées)

  vision:
    enabled: true
    provider: gemini             # gemini | openai — sélectionne l'implémentation du port VisionFallback
    confidence-threshold: 0.55
    quality-threshold: 0.75      # qualité sémantique min d'une grille Tabula borderless ; en dessous → fallback vision
    max-pages-per-document: 20

  # Integration a la place de marche RapidAPI (issue #54) : c'est elle qui authentifie le
  # consommateur, applique le quota de son plan et facture. Sans RAPIDAPI_PROXY_SECRET,
  # l'integration est inactive et seule la cle interne authentifie (dev, admin).
  rapidapi:
    proxy-secret: ${RAPIDAPI_PROXY_SECRET:}
    # Second slot accepte en parallele : sans lui, toute rotation de secret est une coupure,
    # le proxy et le backend ne pouvant pas basculer au meme instant.
    previous-proxy-secret: ${RAPIDAPI_PROXY_SECRET_PREVIOUS:}
    # X-RapidAPI-Subscription -> plan interne. Les noms viennent du tableau de bord provider et
    # peuvent changer sans redeploiement ; un nom absent d'ici retombe sur FREE (echec ferme).
    plan-mapping:
      BASIC: FREE
      PRO: STARTER
      ULTRA: PRO
      MEGA: SCALE

  rate-limit:
    # Debit par consommateur ET par plan : un bucket par appelant, dont la capacite suit son plan.
    # RapidAPI cadence deja ses abonnes ; ces paliers sont une seconde barriere et doivent rester au
    # moins aussi hauts que ceux du listing, sinon ce sont eux qui mordent en premier et le client se
    # voit refuser un debit qu'il a paye.
    free-requests-per-minute: 10
    starter-requests-per-minute: 30
    pro-requests-per-minute: 100
    scale-requests-per-minute: 300

  chunking:
    max-chunk-size: 2000   # ≈ 512 tokens
    overlap: 100
    min-chunk-size: 30     # seuil filtre anti-artefacts

  # Score de confiance "reading-order" (issue #30)
  confidence:
    # Palier 1 — pénalité textuelle par chunk (traces intra-ligne d'entrelacement)
    max-anomaly-rate: 0.2       # taux anomalies/ligne (espaces internes + césures-espace) où la pénalité atteint son plancher
    penalty-floor: 0.3          # un chunk entrelacé ne tombe jamais à 0 sur ce seul signal
    # Palier 3 — score géométrique par chunk (lignes suspectes attribuées au chunk)
    max-suspect-line-rate: 0.3  # fraction de lignes suspectes/chunk où le score d'ordre de lecture atteint son plancher
    reading-order-floor: 0.3    # un chunk entrelacé ne tombe jamais à 0 sur ce seul signal
    manual-review-threshold: 0.4 # confidence finale sous laquelle le chunk est marqué manual_review_needed

  # Nettoyage header/footer en couches (cf. package service.headerfooter)
  header-footer-cleaning:
    enabled: true

    block-vertical-gap-pt: 1       # tolérance Y (pt) pour considérer 2 fragments comme "même ligne"
    header-zone-ratio: 0.15        # un bloc est header SI y0/H < 0.15 (top 15% de la page)
    footer-zone-ratio: 0.15        # un bloc est footer SI y1/H > 0.85 (bottom 15% de la page)
    min-recurrent-pages: 3         # couche récurrence : un pattern doit recurrer sur ≥ N pages (cappé à pageCount)

    # ── Couche DBSCAN (secondaire) ───────────────────────────────────
    dbscan-eps: 0.05               # rayon de voisinage (features page-normalized en [0,1])
    dbscan-min-samples: 3          # taille min d'un noyau de cluster

  page-limits:
    max-pages-free: 100   # plan gratuit → 100 pages max
    max-pages-starter: 300   # plan starter → 300 pages max
    max-pages-pro: 500   # plan pro     → 500 pages max
    max-pages-scale: 1000  # plan scale → 1000 pages max