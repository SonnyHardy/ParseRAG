spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: ParseRAG

  servlet:
    multipart:
      enabled: true
      max-file-size: 50MB
      max-request-size: 50MB

  datasource:
    url: jdbc:postgresql://localhost:${POSTGRES_PORT}/${POSTGRES_DB}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-timeout: 60000
      maximum-pool-size: 5
      idle-timeout: 300000
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        format-sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  # flyway config
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  port: ${SERVER_PORT:8080}

# ── ParseRAG properties (AppProperties.java) ───────────────────
parserag:
  openai:
    api-key: ${OPENAI_API_KEY:}   # vide par défaut en dev
    model: gpt-4o-mini
  vision:
    enabled: true
    confidence-threshold: 0.55
    max-pages-per-document: 20
  rate-limit:
    free-requests-per-minute: 10
    pro-requests-per-minute: 100
  quota:
    free-monthly-docs: 100
    pro-monthly-docs: 5000